<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse — Ambient BPM Detector</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' blob:; media-src 'self' blob:; img-src 'self' data:;">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="logo-row">
                <svg class="logo-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 12h2l2-6 4 12 4-8 2 6h2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1 class="app-title">PULSE</h1>
                <svg class="logo-wave logo-wave-mirror" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 12h2l2-6 4 12 4-8 2 6h2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <p class="app-subtitle">Ambient BPM Detector</p>
        </header>

        <div class="content-area">
            <div class="glow-blob" aria-hidden="true"></div>
            <div class="bpm-circle-wrap">
                <svg class="ring-svg ring-bg" viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <svg class="ring-svg ring-confidence" viewBox="0 0 100 100" aria-hidden="true">
                    <defs>
                        <linearGradient id="ring-gradient" x1="0%" x2="100%" y1="0%" y2="0%">
                            <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
                            <stop offset="100%" stop-color="#F97316"/>
                        </linearGradient>
                    </defs>
                    <circle id="confidence-ring" cx="50" cy="50" r="46" fill="none" stroke="url(#ring-gradient)" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round" stroke-width="3"/>
                </svg>
                <svg class="ring-svg ring-inner" viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="white" stroke-dasharray="289" stroke-dashoffset="260" stroke-linecap="round" stroke-width="4"/>
                </svg>
                <div class="bpm-inner">
                    <div id="genre-badge" class="genre-pill">—</div>
                    <div id="bpm-display-container" class="bpm-digits">
                        <div class="digit-column" id="digit-1">
                            <div class="digit-strip" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>−</span></div>
                        </div>
                        <div class="digit-column" id="digit-2">
                            <div class="digit-strip" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>−</span></div>
                        </div>
                        <div class="digit-column" id="digit-3">
                            <div class="digit-strip" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>−</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="waveform-wrap" aria-label="Live input">
                <canvas id="waveform-canvas" width="280" height="96" aria-label="Audio waveform"></canvas>
            </div>

            <div class="confidence-row">
                <div class="confidence-track">
                    <div id="confidence-fill" class="confidence-fill"></div>
                </div>
                <p id="status-text" class="status-text">Ready to listen</p>
            </div>
        </div>

        <div class="button-wrap">
            <div class="button-glow" aria-hidden="true"></div>
            <button id="listen-btn" type="button" class="listen-btn">
                <span class="stop-icon" aria-hidden="true"></span>
                <span id="btn-text">LISTEN</span>
            </button>
        </div>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
