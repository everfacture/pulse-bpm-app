<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pulse GitHub Repository Banner</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2930d",
                        "background-light": "#f8f7f5",
                        "background-dark": "#050505", "surface-dark": "#121212",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .glow-text {
            text-shadow: 0 0 25px rgba(242, 147, 13, 0.6);
        }

        .glow-ring {
            box-shadow: 0 0 50px rgba(242, 147, 13, 0.25), inset 0 0 20px rgba(242, 147, 13, 0.1);
        }

        .bg-texture {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-[#111] text-slate-100 font-display min-h-screen flex items-center justify-center p-4">
    <div
        class="relative w-full max-w-[1280px] aspect-[2/1] bg-[#050505] rounded-xl overflow-hidden shadow-2xl border border-white/5 flex flex-col items-center justify-center group/banner bg-texture">
        <div
            class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary/5 via-transparent to-transparent opacity-60">
        </div>
        <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none mix-blend-screen">
            <svg class="w-full h-40" fill="none" preserveAspectRatio="none" viewBox="0 0 1200 120"

            </div>
            <span class="text-white text-2xl font-bold tracking-[0.2em] font-sans">PULSE</span>
        </div>
        <div

                        <div class="flex gap-1">

                    </div>
                    <div class="flex-1 flex flex-col items-center justify-between p-6 z-10">

                                <span>Stop Analysis</span>
                            </button>

                    </div>

                        <circle cx="50" cy="50" fill="none" r="44" stroke="#333" stroke-width="4"></circle>
                        <circle class="drop-shadow-[0_0_15px_rgba(242,147,13,0.9)]" cx="50" cy="50" fill="none" r="44"

                            stroke-width="4"></circle>

                    <div class="flex flex-col items-center relative z-10">

                        <div class="flex items-center gap-2 mt-2">
                            <span
                                class="w-2 h-2 bg-primary rounded-full animate-pulse shadow-[0_0_10px_#f2930d]"></span>
                            <span class="text-white/80 text-xl font-bold tracking-[0.3em] uppercase">BPM</span>
                        </div>
                    </div>
                </div>

            </div>

                <div class="flex-1 bg-background-dark p-6 flex flex-col pt-12 relative h-full">

                        <span class="material-symbols-outlined text-white/50">calendar_today</span>
                    </div>
                    <div class="flex flex-col gap-3">
                        <div
                            class="bg-surface-dark/50 border border-white/5 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">
                                    <span class="material-symbols-outlined text-lg">music_note</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-white font-medium">Techno Mix</span>
                                    <span class="text-white/30 text-xs">Today, 10:42</span>
                                </div>
                            </div>
                            <span class="text-white font-bold text-lg">128</span>
                        </div>
                        <div
                            class="bg-surface-dark/50 border border-white/5 p-3 rounded-2xl flex items-center justify-between opacity-80">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/50 font-bold">
                                    <span class="material-symbols-outlined text-lg">mic</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-white font-medium">Recording 2</span>
                                    <span class="text-white/30 text-xs">Yesterday</span>

                            </div>
                            <span class="text-white font-bold text-lg">95</span>
                        </div>
                        <div
                            class="bg-surface-dark/50 border border-white/5 p-3 rounded-2xl flex items-center justify-between opacity-60">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/50 font-bold">
                                    <span class="material-symbols-outlined text-lg">mic</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-white font-medium">Jazz Session</span>
                                    <span class="text-white/30 text-xs">Mon, 12 Oct</span>
                                </div>
                            </div>
                            <span class="text-white font-bold text-lg">84</span>
                        </div>
                        <div
                            class="bg-surface-dark/50 border border-white/5 p-3 rounded-2xl flex items-center justify-between opacity-40">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/50 font-bold">
                                    <span class="material-symbols-outlined text-lg">mic</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-white font-medium">Ambient</span>
                                    <span class="text-white/30 text-xs">Mon, 12 Oct</span>
                                </div>
                            </div>
                            <span class="text-white font-bold text-lg">60</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute bottom-8 w-full text-center z-20">
            <p class="text-white/20 text-xs font-medium tracking-[0.3em] uppercase">High Precision Audio Analysis Engine
                v2.0</p>
        </div>
    </div>

</html>
